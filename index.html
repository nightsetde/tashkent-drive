<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111820">
<title>Tashkent Drive — Prototype</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;font-family:system-ui,-apple-system,Arial;color:#fff;touch-action:none}
  #game{display:block;width:100%;height:100%}
  #hud{position:fixed;inset:0;pointer-events:none}
  .pill{position:absolute;background:#101820c9;border:1px solid #ffffff25;border-radius:14px;padding:9px 12px;font-size:13px;backdrop-filter:blur(6px)}
  #brand{top:12px;left:12px;font-weight:750;letter-spacing:.5px}
  #status{top:12px;right:12px;text-align:right}
  #help{top:58px;left:12px;max-width:210px;font-size:12px;line-height:1.4;color:#d8e2e8}
  #speed{bottom:112px;right:16px;font-size:24px;font-weight:800;min-width:78px;text-align:center}
  #speed small{display:block;font-size:10px;font-weight:500;letter-spacing:1px;color:#b6c5ce}
  #controls{position:fixed;inset:auto 0 0 0;height:150px;display:flex;align-items:end;justify-content:space-between;padding:12px 16px 18px;box-sizing:border-box;pointer-events:none}
  .group{display:flex;gap:10px;align-items:end;pointer-events:auto}
  .btn{width:66px;height:66px;border-radius:20px;border:1px solid #ffffff40;background:#101820b8;color:white;font-size:24px;font-weight:700;display:grid;place-items:center;user-select:none;-webkit-user-select:none;touch-action:none;box-shadow:0 5px 20px #0004}
  .btn:active,.btn.down{background:#e2f2ff55;border-color:#fff}
  .pedal{width:68px;height:82px;font-size:15px;border-radius:18px}
  #reset{position:absolute;right:12px;top:62px;pointer-events:auto;width:auto;height:auto;padding:8px 10px;font-size:12px;border-radius:10px}
  #footer{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:10px;color:#d5e0e7a8;white-space:nowrap}
  @media(min-width:800px){.btn{width:76px;height:76px}.pedal{height:90px;width:78px}#controls{padding-left:28px;padding-right:28px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div id="brand" class="pill">TASHKENT DRIVE <span style="color:#7ee0bd">PROTOTYPE</span></div>
  <div id="status" class="pill">FREE DRIVE<br><span style="color:#a8bbc6">Demo build · v0.1</span></div>
  <div id="help" class="pill">Езда по тестовому 3D-кварталу.<br>◀ ▶ — поворот · GAS — газ · BRAKE — тормоз</div>
  <button id="reset" class="btn">↻ Сброс</button>
  <div id="speed" class="pill">0<small>КМ/Ч</small></div>
  <div id="footer">Демо-прототип • карта пока тестовая, не реальный Ташкент</div>
</div>
<div id="controls">
  <div class="group">
    <button class="btn" data-control="left" aria-label="Поворот налево">◀</button>
    <button class="btn" data-control="right" aria-label="Поворот направо">▶</button>
  </div>
  <div class="group">
    <button class="btn pedal" data-control="brake">BRAKE</button>
    <button class="btn pedal" data-control="gas">GAS</button>
  </div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const canvas = document.querySelector('#game');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.7));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9cc8e4);
scene.fog = new THREE.Fog(0x9cc8e4, 90, 260);
const camera = new THREE.PerspectiveCamera(65, innerWidth/innerHeight, 0.1, 500);
scene.add(new THREE.HemisphereLight(0xd8edff, 0x6d765f, 2.0));
const sun = new THREE.DirectionalLight(0xfff1d5, 2.6);
sun.position.set(-45,75,35); sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024); sun.shadow.camera.left=-90; sun.shadow.camera.right=90; sun.shadow.camera.top=90; sun.shadow.camera.bottom=-90;
scene.add(sun);

const mat=(color,roughness=.85)=>new THREE.MeshStandardMaterial({color,roughness});
const grassMat=mat(0x78966b), roadMat=mat(0x343a40), sidewalkMat=mat(0xb9b8ad), lineMat=mat(0xf3e8b5), glassMat=new THREE.MeshStandardMaterial({color:0x8db9c7,metalness:.25,roughness:.25}), whiteMat=mat(0xe8e6df);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500),grassMat); ground.rotation.x=-Math.PI/2; ground.position.y=-.12; ground.receiveShadow=true; scene.add(ground);

function box(parent,w,h,d,material,x,y,z){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material); m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; parent.add(m); return m;
}
// Roads: central cross and side streets
function road(w,d,x,z){
 const r=new THREE.Mesh(new THREE.PlaneGeometry(w,d),roadMat);r.rotation.x=-Math.PI/2;r.position.set(x,.005,z);r.receiveShadow=true;scene.add(r);
}
road(500,18,0,0); road(18,500,0,0);
for(let i=-4;i<=4;i++){
 const pos=i*12;
 if(Math.abs(pos)>18){
  road(9,500,pos,0); road(500,9,0,pos);
 }
}
// Dashed road markings
function stripe(x,z,w,d){const m=new THREE.Mesh(new THREE.BoxGeometry(w,.025,d),lineMat);m.position.set(x,.025,z);scene.add(m)}
for(let p=-240;p<=240;p+=8){stripe(p,0,3,.16);stripe(0,p,.16,3)}
// Sidewalk edges
for(const p of [-10.2,10.2]){box(scene,500,.22,1,sidewalkMat,0,.03,p);box(scene,1,.22,500,sidewalkMat,p,.03,0)}
// City blocks with simple buildings, parks and trees
let seed=73421; function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
const buildingMats=[0xd7c9ad,0xc4d0d2,0xd8d8cf,0xb7c3c5,0xe1d2bd,0xc7b7a4].map(c=>mat(c));
const treeTrunk=mat(0x6b4a31), treeTop=[mat(0x47724b),mat(0x557f4d),mat(0x6a8c50)];
for(let gx=-5;gx<=5;gx++) for(let gz=-5;gz<=5;gz++){
 const cx=gx*42+21, cz=gz*42+21;
 if(Math.abs(cx)<18||Math.abs(cz)<18) continue;
 if(rand()<.18){
   // small green courtyard
   const park=new THREE.Mesh(new THREE.PlaneGeometry(24,24),mat(0x64865b));park.rotation.x=-Math.PI/2;park.position.set(cx,.01,cz);scene.add(park);
   for(let n=0;n<7;n++){const x=cx+(rand()-.5)*18,z=cz+(rand()-.5)*18;box(scene,.35,2,.35,treeTrunk,x,1,z);const crown=new THREE.Mesh(new THREE.IcosahedronGeometry(1.5,1),treeTop[Math.floor(rand()*3)]);crown.position.set(x,3,z);crown.castShadow=true;scene.add(crown)}
 } else {
   const w=12+rand()*12,d=12+rand()*12,h=7+rand()*25;
   const b=box(scene,w,h,d,buildingMats[Math.floor(rand()*buildingMats.length)],cx+(rand()-.5)*7,h/2,cz+(rand()-.5)*7);
   // Front windows on street-facing side
   const winMat=new THREE.MeshStandardMaterial({color:0x638b9a,roughness:.35,metalness:.1});
   const frontZ=b.position.z+d/2+.012;
   for(let yy=2.2;yy<h-1;yy+=3.2) for(let xx=-w/2+1.6;xx<w/2-1;xx+=3){
     const win=new THREE.Mesh(new THREE.PlaneGeometry(1.35,1.45),winMat);win.position.set(b.position.x+xx,yy,frontZ);scene.add(win);
   }
 }
}
// Car group: points along -Z
const car=new THREE.Group(); scene.add(car);
const bodyMat=new THREE.MeshStandardMaterial({color:0x1f78d1,metalness:.48,roughness:.28});
box(car,2.05,.62,4.15,bodyMat,0,.78,0);
box(car,1.62,.62,1.95,glassMat,0,1.35,-.25);
box(car,1.8,.12,1.35,bodyMat,0,1.05,-.4);
const dark=mat(0x202429), tireMat=mat(0x17191c), rimMat=mat(0xb7c1c7,.4);
const wheels=[];
for(const x of [-1.04,1.04]) for(const z of [-1.35,1.35]){
 const wh=new THREE.Group();wh.position.set(x,.42,z);car.add(wh);
 const tire=new THREE.Mesh(new THREE.CylinderGeometry(.38,.38,.22,18),tireMat);tire.rotation.z=Math.PI/2;tire.castShadow=true;wh.add(tire);
 const rim=new THREE.Mesh(new THREE.CylinderGeometry(.22,.22,.235,16),rimMat);rim.rotation.z=Math.PI/2;wh.add(rim);wheels.push({group:wh,x,z});
}
for(const x of [-.68,.68]){
 const head=new THREE.Mesh(new THREE.BoxGeometry(.42,.17,.08),mat(0xfff2c7,.3));head.position.set(x,.83,-2.09);car.add(head);
 const tail=new THREE.Mesh(new THREE.BoxGeometry(.42,.17,.08),mat(0xc62e25,.3));tail.position.set(x,.83,2.09);car.add(tail);
}
car.position.set(0,0,25);
const keys={left:false,right:false,gas:false,brake:false};
document.querySelectorAll('[data-control]').forEach(btn=>{
 const key=btn.dataset.control;
 const down=e=>{e.preventDefault();keys[key]=true;btn.classList.add('down');try{btn.setPointerCapture(e.pointerId)}catch{}};
 const up=e=>{e.preventDefault();keys[key]=false;btn.classList.remove('down')};
 btn.addEventListener('pointerdown',down);btn.addEventListener('pointerup',up);btn.addEventListener('pointercancel',up);btn.addEventListener('lostpointercapture',up);
});
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;if(e.key==='ArrowRight'||e.key==='d')keys.right=true;if(e.key==='ArrowUp'||e.key==='w')keys.gas=true;if(e.key==='ArrowDown'||e.key==='s'||e.key===' ')keys.brake=true});
window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;if(e.key==='ArrowRight'||e.key==='d')keys.right=false;if(e.key==='ArrowUp'||e.key==='w')keys.gas=false;if(e.key==='ArrowDown'||e.key==='s'||e.key===' ')keys.brake=false});
document.querySelector('#reset').addEventListener('click',()=>{car.position.set(0,0,25);car.rotation.set(0,0,0);speed=0;steer=0});
let speed=0, steer=0, last=performance.now();
const speedEl=document.querySelector('#speed');
function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min((now-last)/1000,.04);last=now;
 if(keys.gas)speed=Math.min(speed+13*dt,38);else speed=Math.max(speed-2.8*dt,0);
 if(keys.brake)speed=Math.max(speed-24*dt,0);
 const target=(keys.left?1:0)-(keys.right?1:0);
 steer+=(target-steer)*Math.min(1,dt*7);
 if(speed>.15) car.rotation.y+=steer*1.05*dt*(speed/12);
 const forward=new THREE.Vector3(0,0,-1).applyQuaternion(car.quaternion);
 car.position.addScaledVector(forward,speed*dt);
 // basic collision boundary around demo district
 car.position.x=THREE.MathUtils.clamp(car.position.x,-238,238);
 car.position.z=THREE.MathUtils.clamp(car.position.z,-238,238);
 wheels.forEach(w=>{if(Math.abs(w.x)>.9){}});
 speedEl.innerHTML=Math.round(speed*3.6)+'<small>КМ/Ч</small>';
 // smooth chase camera
 const behind=new THREE.Vector3(0,5.2,10.5).applyQuaternion(car.quaternion).add(car.position);
 camera.position.lerp(behind,1-Math.exp(-4*dt));
 const look=new THREE.Vector3(0,1.1,-5).applyQuaternion(car.quaternion).add(car.position);
 camera.lookAt(look);
 renderer.render(scene,camera);
}
requestAnimationFrame(animate);
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.7))});
</script>
</body>
</html>
